name: Publicar AMSE.cl
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar-amse-cl
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: amse-cl
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar sitio
        run: npm test
      - name: Preparar archivos públicos
        run: node build.mjs
      - name: Publicar por FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy_ftps.py
